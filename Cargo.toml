[workspace]
resolver = "2"
members = [
    "crates/warp-core",
    "crates/warp-storage",
    "crates/warp-protocols",
    "crates/warp-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Personal and Educational Free License v1.0 (LicenseRef-PEFL-1.0)
license-file = "LICENSE"
authors = ["Rubens Rainelli <rubens@rainelli.it>"]

[workspace.dependencies]
warp-core = { path = "crates/warp-core" }
warp-storage = { path = "crates/warp-storage" }
warp-protocols = { path = "crates/warp-protocols" }

tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "net", "io-util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
bitflags = { version = "2.6", features = ["serde"] }
compact_str = { version = "0.8", features = ["serde"] }
async-trait = "0.1"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled"] }
slint = "1.8"
slint-build = "1.8"
base64 = "0.23"
hex = "0.4"
crc32fast = "1.5"
fastrand = "2.5"
url = "2.5"
