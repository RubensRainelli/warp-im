[package]
name = "warp-app"
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true

[lib]
name = "warp_app"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "warp-app"
path = "src/main.rs"

[dependencies]
warp-core.workspace = true
warp-storage.workspace = true
warp-protocols.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
compact_str.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
[target.'cfg(not(target_os = "android"))'.dependencies]
slint = { workspace = true, features = ["renderer-software", "compat-1-2"] }

[target.'cfg(target_os = "android")'.dependencies]
slint = { workspace = true, features = ["renderer-software", "system-testing", "compat-1-2"] }
android-activity = { version = "0.6", features = ["native-activity"] }
jni = "0.22"

[build-dependencies]
slint-build.workspace = true
